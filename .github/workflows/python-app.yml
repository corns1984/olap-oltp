name: Run Python Files

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Python files
        run: |
          for file in *.py; do
            echo "Running $file"
            python "$file"
          done
