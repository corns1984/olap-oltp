name: Run Python Files

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run all Python files
        run: |
          find . -name "*.py" -type f -print0 | while IFS= read -r -d '' file; do
            echo "Running $file"
            python "$file"
          done
